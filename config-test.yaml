# Planet Blog Aggregator Configuration

# General site settings
site:
  title: "Test Planet"
  site_url: "https://rkdarst.github.io/pyplanet2/"
  atom_feed_url: "https://rkdarst.github.io/pyplanet2/atom.xml"
  # feed_guid: "urn:uuid:60a76c80-d399-11d9-b93C-0003939e0af6"  (optional)

# Output file paths
output:
  atom_feed: "atom.xml"
  html_view: "planet.html"
  css: []
  logo: "static/favicon.ico"    # optional logo image path/URL for the HTML view
  favicon: static/favicon.ico

# Item limits
limits:
  max_feed_items: 100    # Maximum items in the aggregated Atom feed
  html_view_limit: 10    # Number of posts to show in HTML view

images:
  dir: "images-cached"  # cache = deploy output directory
  ttl_days: 1     # revalidate after this, and forget an unused copy
  # image_cache_max_bytes: 10485760  # larger images are dropped (10 MB)
  # base_url: "https://example.com/planet/"  # default: site.site_url

# Feed configuration with metadata
feeds:

  - feed: "test-data/atom.xml"
    name: "Atom test"
    site: "example.org"
    icon: "https://raw.githubusercontent.com/rkdarst/pyplanet2/refs/heads/master/static/icon-remote.png"

  - feed: "test-data/rss.xml"
    name: "RSS test"
    site: "example.org"
    icon: "https://raw.githubusercontent.com/rkdarst/pyplanet2/refs/heads/master/static/icon-remote.png"

  - feed: "test-data/atom-relative.xml"
    name: "ATOM relative test"
    site: "example.org"
    icon: "static/icon.png"
