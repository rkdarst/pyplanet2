# Planet Blog Aggregator Configuration

# General site settings
site:
  title: "Test Planet"
  site_url: "https://example.com/planet/"
  atom_feed_url: "https://example.com/planet/atom.xml"

# Output file paths
output:
  atom_feed: "atom.xml"
  html_view: "planet.html"

# Item limits
limits:
  max_feed_items: 100    # Maximum items in the aggregated Atom feed
  html_view_limit: 10    # Number of posts to show in HTML view

# Feed configuration with metadata
feeds:

  - url: "test-data/atom.xml"
    name: "Atom test"
    author: "a"
    site: "example.org"

  - url: "test-data/rss.xml"
    name: "RSS test"
    author: "b"
    site: "example.org"